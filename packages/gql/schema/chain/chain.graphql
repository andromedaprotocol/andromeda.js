query CHAIN_CONFIG($identifier: String!) {
  chainConfigs {
    config(identifier: $identifier) {
      ...chainConfig
    }
  }
}
query ALL_CHAIN_CONFIG {
  chainConfigs {
    allConfigs {
      ...chainConfig
    }
  }
}

query ALL_STORED_CHAIN_CONFIG {
  chainConfigs {
    allStoredConfigs {
      ...chainConfig
    }
  }
}
